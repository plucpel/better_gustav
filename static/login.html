<!DOCTYPE html>
<html lang="fr" class="h-full bg-[#021b1a]">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Accès Sécurisé | Gustav - Infirmia</title>
  <link rel="icon" type="image/svg+xml" href="/static/images/infirmia-logo.svg">
  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0faf9',
              100: '#e6f7f7',
              200: '#bfeeed',
              300: '#8fe0dd',
              400: '#4ac9c5',
              500: '#04ada9',
              600: '#038e8a',
              700: '#02716e',
              800: '#025957',
              900: '#063a39',
              950: '#021b1a',
            }
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
    body { font-family: 'Inter', sans-serif; }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }
    .shake { animation: shake 0.4s ease-in-out; }
    .pin-dot.filled {
      background-color: #04ada9;
      transform: scale(1.2);
      box-shadow: 0 0 14px rgba(4, 173, 169, 0.8);
    }
  </style>
</head>
<body class="h-full flex items-center justify-center p-4 bg-gradient-to-br from-[#021b1a] via-[#042827] to-[#083e3c] text-slate-100 selection:bg-[#04ada9] selection:text-white">

  <div class="w-full max-w-md">
    <!-- Header / Brand -->
    <div class="text-center mb-6">
      <div class="inline-flex items-center justify-center p-3 rounded-2xl bg-white/10 backdrop-blur-md shadow-xl shadow-black/40 mb-3 border border-[#04ada9]/30">
        <img src="/static/images/infirmia-logo.png" alt="Logo Infirmia" class="h-10 w-auto object-contain brightness-0 invert" onerror="this.style.display='none'; document.getElementById('logoFallback').style.display='flex';" />
        <div id="logoFallback" class="hidden items-center justify-center w-12 h-12">
          <i class="fa-solid fa-vial-virus text-[#04ada9] text-3xl"></i>
        </div>
      </div>
      <h1 class="text-2xl font-bold tracking-tight text-white flex items-center justify-center gap-2">
        <span>GUSTAV</span>
        <span class="text-xs font-semibold px-2.5 py-0.5 rounded-full bg-[#04ada9]/20 text-[#4ac9c5] border border-[#04ada9]/30">Soins Infirmiers</span>
      </h1>
      <p class="text-xs text-teal-200/70 mt-1">Infirmia • Manuel des prélèvements & Ordre de tirage</p>
    </div>

    <!-- Login Card -->
    <div id="pinCard" class="bg-[#03201f]/80 backdrop-blur-xl border border-[#04ada9]/25 rounded-3xl p-6 sm:p-8 shadow-2xl shadow-black/60 transition-all">
      <div class="text-center mb-5">
        <div class="inline-flex items-center justify-center w-10 h-10 rounded-full bg-[#042827] text-[#04ada9] mb-2 border border-[#04ada9]/30 shadow-inner">
          <i class="fa-solid fa-lock text-base"></i>
        </div>
        <h2 class="text-lg font-semibold text-white">Authentification requise</h2>
        <p class="text-xs text-slate-400 mt-0.5">Saisissez votre code PIN de poste pour déverrouiller</p>
      </div>

      <!-- Hidden form for physical keyboard & screen readers -->
      <form id="pinForm" onsubmit="submitPin(event)" class="mb-5">
        <input 
          type="password" 
          id="pinInput" 
          inputmode="numeric" 
          pattern="[0-9]*" 
          maxlength="12" 
          autocomplete="current-password" 
          autofocus
          class="opacity-0 absolute -z-10 w-0 h-0"
        />

        <!-- Visual PIN Indicators / Display -->
        <div class="flex items-center justify-center space-x-3 py-3.5 bg-[#011413]/70 rounded-2xl border border-[#04ada9]/20 cursor-pointer shadow-inner" onclick="focusPinInput()">
          <div class="pin-dot w-3.5 h-3.5 rounded-full bg-slate-700 transition-all duration-200" data-idx="0"></div>
          <div class="pin-dot w-3.5 h-3.5 rounded-full bg-slate-700 transition-all duration-200" data-idx="1"></div>
          <div class="pin-dot w-3.5 h-3.5 rounded-full bg-slate-700 transition-all duration-200" data-idx="2"></div>
          <div class="pin-dot w-3.5 h-3.5 rounded-full bg-slate-700 transition-all duration-200" data-idx="3"></div>
          <div class="pin-dot w-3.5 h-3.5 rounded-full bg-slate-700 transition-all duration-200" data-idx="4"></div>
          <div class="pin-dot w-3.5 h-3.5 rounded-full bg-slate-700 transition-all duration-200" data-idx="5"></div>
        </div>

        <!-- Error feedback -->
        <div id="errorMsg" class="text-center text-rose-400 text-xs font-medium mt-2.5 min-h-[1.25rem] transition-opacity opacity-0">
          Code PIN incorrect
        </div>
      </form>

      <!-- Keypad (for touchscreens, tablets, medical carts) -->
      <div class="grid grid-cols-3 gap-2.5 max-w-xs mx-auto">
        <button type="button" onclick="pressKey('1')" class="keypad-btn h-13 py-3 rounded-2xl bg-[#042c2b]/70 hover:bg-[#054341] active:bg-[#04ada9] text-white font-semibold text-lg border border-[#04ada9]/20 shadow-sm transition-all focus:outline-none">1</button>
        <button type="button" onclick="pressKey('2')" class="keypad-btn h-13 py-3 rounded-2xl bg-[#042c2b]/70 hover:bg-[#054341] active:bg-[#04ada9] text-white font-semibold text-lg border border-[#04ada9]/20 shadow-sm transition-all focus:outline-none">2</button>
        <button type="button" onclick="pressKey('3')" class="keypad-btn h-13 py-3 rounded-2xl bg-[#042c2b]/70 hover:bg-[#054341] active:bg-[#04ada9] text-white font-semibold text-lg border border-[#04ada9]/20 shadow-sm transition-all focus:outline-none">3</button>
        
        <button type="button" onclick="pressKey('4')" class="keypad-btn h-13 py-3 rounded-2xl bg-[#042c2b]/70 hover:bg-[#054341] active:bg-[#04ada9] text-white font-semibold text-lg border border-[#04ada9]/20 shadow-sm transition-all focus:outline-none">4</button>
        <button type="button" onclick="pressKey('5')" class="keypad-btn h-13 py-3 rounded-2xl bg-[#042c2b]/70 hover:bg-[#054341] active:bg-[#04ada9] text-white font-semibold text-lg border border-[#04ada9]/20 shadow-sm transition-all focus:outline-none">5</button>
        <button type="button" onclick="pressKey('6')" class="keypad-btn h-13 py-3 rounded-2xl bg-[#042c2b]/70 hover:bg-[#054341] active:bg-[#04ada9] text-white font-semibold text-lg border border-[#04ada9]/20 shadow-sm transition-all focus:outline-none">6</button>
        
        <button type="button" onclick="pressKey('7')" class="keypad-btn h-13 py-3 rounded-2xl bg-[#042c2b]/70 hover:bg-[#054341] active:bg-[#04ada9] text-white font-semibold text-lg border border-[#04ada9]/20 shadow-sm transition-all focus:outline-none">7</button>
        <button type="button" onclick="pressKey('8')" class="keypad-btn h-13 py-3 rounded-2xl bg-[#042c2b]/70 hover:bg-[#054341] active:bg-[#04ada9] text-white font-semibold text-lg border border-[#04ada9]/20 shadow-sm transition-all focus:outline-none">8</button>
        <button type="button" onclick="pressKey('9')" class="keypad-btn h-13 py-3 rounded-2xl bg-[#042c2b]/70 hover:bg-[#054341] active:bg-[#04ada9] text-white font-semibold text-lg border border-[#04ada9]/20 shadow-sm transition-all focus:outline-none">9</button>
        
        <button type="button" onclick="clearPin()" class="keypad-btn h-13 py-3 rounded-2xl bg-[#021b1a]/60 hover:bg-[#032a29] active:bg-[#04ada9] text-teal-300/80 hover:text-white font-bold text-xs border border-[#04ada9]/15 shadow-sm transition-all focus:outline-none flex items-center justify-center tracking-wider" title="Effacer tout">
          <span>EFFACER</span>
        </button>
        <button type="button" onclick="pressKey('0')" class="keypad-btn h-13 py-3 rounded-2xl bg-[#042c2b]/70 hover:bg-[#054341] active:bg-[#04ada9] text-white font-semibold text-lg border border-[#04ada9]/20 shadow-sm transition-all focus:outline-none">0</button>
        <button type="button" onclick="backspacePin()" class="keypad-btn h-13 py-3 rounded-2xl bg-[#021b1a]/60 hover:bg-[#032a29] active:bg-[#04ada9] text-teal-300/80 hover:text-white font-medium text-base border border-[#04ada9]/15 shadow-sm transition-all focus:outline-none flex items-center justify-center" title="Retour arrière">
          <i class="fa-solid fa-delete-left"></i>
        </button>
      </div>

      <!-- Action button -->
      <div class="mt-5 max-w-xs mx-auto">
        <button 
          type="button" 
          id="btnUnlock"
          onclick="submitPin()" 
          class="w-full py-3.5 rounded-2xl bg-gradient-to-r from-[#04ada9] to-[#038e8a] hover:from-[#039693] hover:to-[#027572] active:scale-[0.98] text-white font-bold text-sm shadow-lg shadow-[#04ada9]/30 transition-all flex items-center justify-center space-x-2 cursor-pointer"
        >
          <i class="fa-solid fa-lock-open text-xs"></i>
          <span>Déverrouiller GUSTAV</span>
        </button>
      </div>
    </div>

    <!-- Footer Notice -->
    <div class="text-center mt-6 text-xs text-slate-500">
      <p><i class="fa-solid fa-shield-halved text-[#04ada9] mr-1"></i> Session sécurisée Infirmia — expire à la fermeture de l'onglet</p>
    </div>
  </div>

  <script>
    let currentPin = '';
    const pinInput = document.getElementById('pinInput');
    const pinCard = document.getElementById('pinCard');
    const errorMsg = document.getElementById('errorMsg');
    const dots = document.querySelectorAll('.pin-dot');
    const btnUnlock = document.getElementById('btnUnlock');
    let isSubmitting = false;

    function focusPinInput() {
      if (pinInput) pinInput.focus();
    }

    // Auto-focus on load
    window.addEventListener('DOMContentLoaded', () => {
      focusPinInput();
    });

    // Capture physical keyboard typing
    document.addEventListener('keydown', (e) => {
      if (isSubmitting) return;
      if (e.key >= '0' && e.key <= '9') {
        pressKey(e.key);
      } else if (e.key === 'Backspace') {
        backspacePin();
      } else if (e.key === 'Escape') {
        clearPin();
      } else if (e.key === 'Enter') {
        submitPin();
      }
    });

    function updateDots() {
      dots.forEach((dot, idx) => {
        if (idx < currentPin.length) {
          dot.classList.add('filled');
        } else {
          dot.classList.remove('filled');
        }
      });
      hideError();
    }

    function pressKey(num) {
      if (isSubmitting || currentPin.length >= 12) return;
      currentPin += num;
      if (pinInput) pinInput.value = currentPin;
      updateDots();

      // Automatically submit when default length (6 digits) is reached
      if (currentPin.length === 6) {
        submitPin();
      }
    }

    function backspacePin() {
      if (isSubmitting) return;
      currentPin = currentPin.slice(0, -1);
      if (pinInput) pinInput.value = currentPin;
      updateDots();
    }

    function clearPin() {
      if (isSubmitting) return;
      currentPin = '';
      if (pinInput) pinInput.value = '';
      updateDots();
    }

    function showError(msg) {
      if (errorMsg) {
        errorMsg.textContent = msg || 'Code PIN incorrect';
        errorMsg.classList.remove('opacity-0');
      }
      if (pinCard) {
        pinCard.classList.remove('shake');
        void pinCard.offsetWidth; // Trigger reflow
        pinCard.classList.add('shake');
      }
    }

    function hideError() {
      if (errorMsg) {
        errorMsg.classList.add('opacity-0');
      }
    }

    async function submitPin(e) {
      if (e) e.preventDefault();
      if (isSubmitting) return;

      const pinToSubmit = currentPin || (pinInput ? pinInput.value.trim() : '');
      if (!pinToSubmit) {
        showError('Veuillez entrer un code PIN');
        return;
      }

      isSubmitting = true;
      btnUnlock.disabled = true;
      btnUnlock.innerHTML = '<i class="fa-solid fa-spinner fa-spin text-xs"></i> <span>Vérification...</span>';

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pin: pinToSubmit })
        });

        if (response.ok) {
          btnUnlock.className = btnUnlock.className.replace('from-[#04ada9] to-[#038e8a]', 'from-emerald-600 to-teal-600');
          btnUnlock.innerHTML = '<i class="fa-solid fa-check text-xs"></i> <span>Accès accordé</span>';
          // Instant reload to load full Gustav app with authenticated session cookie
          setTimeout(() => {
            window.location.reload();
          }, 250);
        } else {
          const data = await response.json().catch(() => ({}));
          showError(data.detail || 'Code PIN incorrect');
          clearPin();
          isSubmitting = false;
          btnUnlock.disabled = false;
          btnUnlock.innerHTML = '<i class="fa-solid fa-lock-open text-xs"></i> <span>Déverrouiller GUSTAV</span>';
          focusPinInput();
        }
      } catch (err) {
        showError('Erreur de connexion au serveur');
        clearPin();
        isSubmitting = false;
        btnUnlock.disabled = false;
        btnUnlock.innerHTML = '<i class="fa-solid fa-lock-open text-xs"></i> <span>Déverrouiller GUSTAV</span>';
        focusPinInput();
      }
    }
  </script>
</body>
</html>
