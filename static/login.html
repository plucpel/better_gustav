<!DOCTYPE html>
<html lang="fr" class="h-full bg-slate-900">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Accès Sécurisé | Gustav - CHU de Québec</title>
  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              500: '#0284c7',
              600: '#0369a1',
              700: '#075985',
              800: '#0c4a6e',
              900: '#082f49',
            }
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
    body { font-family: 'Inter', sans-serif; }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }
    .shake { animation: shake 0.4s ease-in-out; }
    .pin-dot.filled {
      background-color: #38bdf8;
      transform: scale(1.15);
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.6);
    }
  </style>
</head>
<body class="h-full flex items-center justify-center p-4 bg-gradient-to-br from-slate-950 via-slate-900 to-sky-950 text-slate-100 selection:bg-sky-500 selection:text-white">

  <div class="w-full max-w-md">
    <!-- Header / Brand -->
    <div class="text-center mb-6">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-tr from-sky-600 to-indigo-600 shadow-xl shadow-sky-900/40 mb-3 border border-sky-400/30">
        <i class="fa-solid fa-vial-virus text-white text-3xl"></i>
      </div>
      <h1 class="text-2xl font-bold tracking-tight text-white flex items-center justify-center gap-2">
        <span>GUSTAV</span>
        <span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-sky-500/20 text-sky-300 border border-sky-400/30">Sécurisé</span>
      </h1>
      <p class="text-xs text-sky-200/70 mt-1">CHU de Québec-Université Laval • Calculateur de Tubes</p>
    </div>

    <!-- Login Card -->
    <div id="pinCard" class="bg-slate-900/80 backdrop-blur-xl border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl shadow-black/50 transition-all">
      <div class="text-center mb-5">
        <div class="inline-flex items-center justify-center w-10 h-10 rounded-full bg-slate-800 text-sky-400 mb-2 border border-slate-700">
          <i class="fa-solid fa-lock text-base"></i>
        </div>
        <h2 class="text-lg font-semibold text-white">Authentification requise</h2>
        <p class="text-xs text-slate-400 mt-0.5">Saisissez le code PIN pour déverrouiller l'accès</p>
      </div>

      <!-- Hidden form for physical keyboard & screen readers -->
      <form id="pinForm" onsubmit="submitPin(event)" class="mb-5">
        <input 
          type="password" 
          id="pinInput" 
          inputmode="numeric" 
          pattern="[0-9]*" 
          maxlength="12" 
          autocomplete="current-password" 
          autofocus
          class="opacity-0 absolute -z-10 w-0 h-0"
        />

        <!-- Visual PIN Indicators / Display -->
        <div class="flex items-center justify-center space-x-3 py-3 bg-slate-950/60 rounded-2xl border border-slate-800/80 cursor-pointer" onclick="focusPinInput()">
          <div class="pin-dot w-3.5 h-3.5 rounded-full bg-slate-700 transition-all duration-200" data-idx="0"></div>
          <div class="pin-dot w-3.5 h-3.5 rounded-full bg-slate-700 transition-all duration-200" data-idx="1"></div>
          <div class="pin-dot w-3.5 h-3.5 rounded-full bg-slate-700 transition-all duration-200" data-idx="2"></div>
          <div class="pin-dot w-3.5 h-3.5 rounded-full bg-slate-700 transition-all duration-200" data-idx="3"></div>
          <div class="pin-dot w-3.5 h-3.5 rounded-full bg-slate-700 transition-all duration-200" data-idx="4"></div>
          <div class="pin-dot w-3.5 h-3.5 rounded-full bg-slate-700 transition-all duration-200" data-idx="5"></div>
        </div>

        <!-- Error feedback -->
        <div id="errorMsg" class="text-center text-rose-400 text-xs font-medium mt-2 min-h-[1.25rem] transition-opacity opacity-0">
          Code PIN incorrect
        </div>
      </form>

      <!-- Keypad (for touchscreens, tablets, medical carts) -->
      <div class="grid grid-cols-3 gap-2.5 max-w-xs mx-auto">
        <button type="button" onclick="pressKey('1')" class="keypad-btn h-13 py-3 rounded-2xl bg-slate-800/70 hover:bg-slate-700 active:bg-sky-600 text-white font-semibold text-lg border border-slate-700/60 shadow-sm transition-all focus:outline-none">1</button>
        <button type="button" onclick="pressKey('2')" class="keypad-btn h-13 py-3 rounded-2xl bg-slate-800/70 hover:bg-slate-700 active:bg-sky-600 text-white font-semibold text-lg border border-slate-700/60 shadow-sm transition-all focus:outline-none">2</button>
        <button type="button" onclick="pressKey('3')" class="keypad-btn h-13 py-3 rounded-2xl bg-slate-800/70 hover:bg-slate-700 active:bg-sky-600 text-white font-semibold text-lg border border-slate-700/60 shadow-sm transition-all focus:outline-none">3</button>
        
        <button type="button" onclick="pressKey('4')" class="keypad-btn h-13 py-3 rounded-2xl bg-slate-800/70 hover:bg-slate-700 active:bg-sky-600 text-white font-semibold text-lg border border-slate-700/60 shadow-sm transition-all focus:outline-none">4</button>
        <button type="button" onclick="pressKey('5')" class="keypad-btn h-13 py-3 rounded-2xl bg-slate-800/70 hover:bg-slate-700 active:bg-sky-600 text-white font-semibold text-lg border border-slate-700/60 shadow-sm transition-all focus:outline-none">5</button>
        <button type="button" onclick="pressKey('6')" class="keypad-btn h-13 py-3 rounded-2xl bg-slate-800/70 hover:bg-slate-700 active:bg-sky-600 text-white font-semibold text-lg border border-slate-700/60 shadow-sm transition-all focus:outline-none">6</button>
        
        <button type="button" onclick="pressKey('7')" class="keypad-btn h-13 py-3 rounded-2xl bg-slate-800/70 hover:bg-slate-700 active:bg-sky-600 text-white font-semibold text-lg border border-slate-700/60 shadow-sm transition-all focus:outline-none">7</button>
        <button type="button" onclick="pressKey('8')" class="keypad-btn h-13 py-3 rounded-2xl bg-slate-800/70 hover:bg-slate-700 active:bg-sky-600 text-white font-semibold text-lg border border-slate-700/60 shadow-sm transition-all focus:outline-none">8</button>
        <button type="button" onclick="pressKey('9')" class="keypad-btn h-13 py-3 rounded-2xl bg-slate-800/70 hover:bg-slate-700 active:bg-sky-600 text-white font-semibold text-lg border border-slate-700/60 shadow-sm transition-all focus:outline-none">9</button>
        
        <button type="button" onclick="clearPin()" class="keypad-btn h-13 py-3 rounded-2xl bg-slate-800/40 hover:bg-slate-800 active:bg-slate-700 text-slate-400 hover:text-white font-medium text-xs border border-slate-700/40 shadow-sm transition-all focus:outline-none flex items-center justify-center" title="Effacer tout">
          <span>EFFACER</span>
        </button>
        <button type="button" onclick="pressKey('0')" class="keypad-btn h-13 py-3 rounded-2xl bg-slate-800/70 hover:bg-slate-700 active:bg-sky-600 text-white font-semibold text-lg border border-slate-700/60 shadow-sm transition-all focus:outline-none">0</button>
        <button type="button" onclick="backspacePin()" class="keypad-btn h-13 py-3 rounded-2xl bg-slate-800/40 hover:bg-slate-800 active:bg-slate-700 text-slate-400 hover:text-white font-medium text-base border border-slate-700/40 shadow-sm transition-all focus:outline-none flex items-center justify-center" title="Retour arrière">
          <i class="fa-solid fa-delete-left"></i>
        </button>
      </div>

      <!-- Action button -->
      <div class="mt-5 max-w-xs mx-auto">
        <button 
          type="button" 
          id="btnUnlock"
          onclick="submitPin()" 
          class="w-full py-3 rounded-2xl bg-gradient-to-r from-sky-600 to-indigo-600 hover:from-sky-500 hover:to-indigo-500 active:scale-[0.98] text-white font-semibold text-sm shadow-lg shadow-sky-900/30 transition-all flex items-center justify-center space-x-2"
        >
          <i class="fa-solid fa-lock-open text-xs"></i>
          <span>Déverrouiller</span>
        </button>
      </div>
    </div>

    <!-- Footer Notice -->
    <div class="text-center mt-6 text-xs text-slate-500">
      <p><i class="fa-solid fa-shield-halved text-slate-600 mr-1"></i> Session temporaire — expire à la fermeture de l'onglet</p>
    </div>
  </div>

  <script>
    let currentPin = '';
    const pinInput = document.getElementById('pinInput');
    const pinCard = document.getElementById('pinCard');
    const errorMsg = document.getElementById('errorMsg');
    const dots = document.querySelectorAll('.pin-dot');
    const btnUnlock = document.getElementById('btnUnlock');
    let isSubmitting = false;

    function focusPinInput() {
      if (pinInput) pinInput.focus();
    }

    // Auto-focus on load
    window.addEventListener('DOMContentLoaded', () => {
      focusPinInput();
    });

    // Capture physical keyboard typing
    document.addEventListener('keydown', (e) => {
      if (isSubmitting) return;
      if (e.key >= '0' && e.key <= '9') {
        pressKey(e.key);
      } else if (e.key === 'Backspace') {
        backspacePin();
      } else if (e.key === 'Escape') {
        clearPin();
      } else if (e.key === 'Enter') {
        submitPin();
      }
    });

    function updateDots() {
      dots.forEach((dot, idx) => {
        if (idx < currentPin.length) {
          dot.classList.add('filled');
        } else {
          dot.classList.remove('filled');
        }
      });
      hideError();
    }

    function pressKey(num) {
      if (isSubmitting || currentPin.length >= 12) return;
      currentPin += num;
      if (pinInput) pinInput.value = currentPin;
      updateDots();

      // Automatically submit when default length (6 digits) is reached
      if (currentPin.length === 6) {
        submitPin();
      }
    }

    function backspacePin() {
      if (isSubmitting) return;
      currentPin = currentPin.slice(0, -1);
      if (pinInput) pinInput.value = currentPin;
      updateDots();
    }

    function clearPin() {
      if (isSubmitting) return;
      currentPin = '';
      if (pinInput) pinInput.value = '';
      updateDots();
    }

    function showError(msg) {
      if (errorMsg) {
        errorMsg.textContent = msg || 'Code PIN incorrect';
        errorMsg.classList.remove('opacity-0');
      }
      if (pinCard) {
        pinCard.classList.remove('shake');
        void pinCard.offsetWidth; // Trigger reflow
        pinCard.classList.add('shake');
      }
    }

    function hideError() {
      if (errorMsg) {
        errorMsg.classList.add('opacity-0');
      }
    }

    async function submitPin(e) {
      if (e) e.preventDefault();
      if (isSubmitting) return;

      const pinToSubmit = currentPin || (pinInput ? pinInput.value.trim() : '');
      if (!pinToSubmit) {
        showError('Veuillez entrer un code PIN');
        return;
      }

      isSubmitting = true;
      btnUnlock.disabled = true;
      btnUnlock.innerHTML = '<i class="fa-solid fa-spinner fa-spin text-xs"></i> <span>Vérification...</span>';

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pin: pinToSubmit })
        });

        if (response.ok) {
          btnUnlock.className = btnUnlock.className.replace('from-sky-600 to-indigo-600', 'from-emerald-600 to-teal-600');
          btnUnlock.innerHTML = '<i class="fa-solid fa-check text-xs"></i> <span>Accès accordé</span>';
          // Instant reload to load full Gustav app with authenticated session cookie
          setTimeout(() => {
            window.location.reload();
          }, 250);
        } else {
          const data = await response.json().catch(() => ({}));
          showError(data.detail || 'Code PIN incorrect');
          clearPin();
          isSubmitting = false;
          btnUnlock.disabled = false;
          btnUnlock.innerHTML = '<i class="fa-solid fa-lock-open text-xs"></i> <span>Déverrouiller</span>';
          focusPinInput();
        }
      } catch (err) {
        showError('Erreur de connexion au serveur');
        clearPin();
        isSubmitting = false;
        btnUnlock.disabled = false;
        btnUnlock.innerHTML = '<i class="fa-solid fa-lock-open text-xs"></i> <span>Déverrouiller</span>';
        focusPinInput();
      }
    }
  </script>
</body>
</html>
