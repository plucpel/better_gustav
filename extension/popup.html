<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>GUSTAV - Passerelle Medesync</title>
  <style>
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 16px;
      background: #f8fafc;
      color: #0f172a;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid #e2e8f0;
    }
    .header h2 {
      margin: 0;
      font-size: 15px;
      font-weight: 700;
      color: #0369a1;
    }
    .btn-main {
      width: 100%;
      padding: 10px 14px;
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 2px 6px rgba(2, 132, 199, 0.35);
      transition: all 0.2s;
    }
    .btn-main:hover {
      background: linear-gradient(135deg, #0369a1 0%, #075985 100%);
      transform: translateY(-1px);
    }
    .field {
      margin-bottom: 10px;
    }
    label {
      display: block;
      font-size: 10px;
      font-weight: 700;
      color: #64748b;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    input[type="text"], input[type="password"] {
      width: 100%;
      box-sizing: border-box;
      padding: 7px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 12px;
      background: #fff;
    }
    input:focus {
      outline: none;
      border-color: #0284c7;
      box-shadow: 0 0 0 2px rgba(2, 132, 199, 0.2);
    }
    .btn-secondary {
      width: 100%;
      padding: 7px 10px;
      background: #f1f5f9;
      color: #334155;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 6px;
      transition: background 0.2s;
    }
    .btn-secondary:hover {
      background: #e2e8f0;
    }
    .status {
      margin-top: 10px;
      padding: 6px 8px;
      border-radius: 4px;
      font-size: 11px;
      display: none;
    }
    .status.success {
      display: block;
      background: #ecfdf5;
      color: #065f46;
      border: 1px solid #a7f3d0;
    }
    .status.error {
      display: block;
      background: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }
  </style>
</head>
<body>
  <div class="header">
    <span style="font-size: 18px;">🧪</span>
    <h2>GUSTAV - Passerelle Medesync</h2>
  </div>

  <button id="launchBtn" class="btn-main">
    <span>🧪</span>
    <span>Ouvrir GUSTAV (Onglet Actif)</span>
  </button>

  <details style="margin-top: 8px;">
    <summary style="font-size: 11px; font-weight: 600; color: #64748b; cursor: pointer;">⚙️ Paramètres avancés</summary>
    <div style="margin-top: 8px;">
      <div class="field">
        <label for="gustavUrl">URL du Serveur GUSTAV</label>
        <input type="text" id="gustavUrl" placeholder="https://gustav.plucpel.net">
      </div>

      <div class="field">
        <label for="extensionSecret">Clé Secrète Clinique</label>
        <input type="password" id="extensionSecret" placeholder="••••••••••••">
      </div>

      <button id="saveBtn" class="btn-secondary" style="background: #0284c7; color: #fff; border-color: #0284c7;">Enregistrer</button>
      <button id="testBtn" class="btn-secondary">Tester la Connexion</button>
    </div>
  </details>

  <div id="statusMsg" class="status"></div>

  <script src="popup.js"></script>
</body>
</html>
