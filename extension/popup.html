<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Options GUSTAV</title>
  <style>
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 18px;
      background: #f8fafc;
      color: #0f172a;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #e2e8f0;
    }
    .header h2 {
      margin: 0;
      font-size: 15px;
      font-weight: 700;
      color: #0369a1;
    }
    .field {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: #475569;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    input[type="text"], input[type="password"] {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 12px;
      background: #fff;
    }
    input:focus {
      outline: none;
      border-color: #0284c7;
      box-shadow: 0 0 0 2px rgba(2, 132, 199, 0.2);
    }
    .btn-save {
      width: 100%;
      padding: 9px 12px;
      background: #0284c7;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 6px;
      transition: background 0.2s;
    }
    .btn-save:hover {
      background: #0369a1;
    }
    .btn-test {
      width: 100%;
      padding: 8px 12px;
      background: #f1f5f9;
      color: #334155;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 6px;
      transition: background 0.2s;
    }
    .btn-test:hover {
      background: #e2e8f0;
    }
    .status {
      margin-top: 12px;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 11px;
      display: none;
    }
    .status.success {
      display: block;
      background: #ecfdf5;
      color: #065f46;
      border: 1px solid #a7f3d0;
    }
    .status.error {
      display: block;
      background: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }
  </style>
</head>
<body>
  <div class="header">
    <span style="font-size: 22px;">🧪</span>
    <div>
      <h2>GUSTAV - Options</h2>
      <div style="font-size: 11px; color: #64748b;">Passerelle Medesync</div>
    </div>
  </div>

  <div class="field">
    <label for="gustavUrl">URL du Serveur GUSTAV</label>
    <input type="text" id="gustavUrl" placeholder="https://gustav.plucpel.net">
  </div>

  <div class="field">
    <label for="extensionSecret">Clé Secrète Clinique</label>
    <input type="password" id="extensionSecret" placeholder="••••••••••••">
  </div>

  <button id="saveBtn" class="btn-save">Enregistrer les Réglages</button>
  <button id="testBtn" class="btn-test">Tester la Connexion</button>

  <div id="statusMsg" class="status"></div>

  <script src="popup.js"></script>
</body>
</html>
